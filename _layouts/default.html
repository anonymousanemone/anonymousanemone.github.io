<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
  	<meta name="viewport" content="width=device-width, initial-scale=1">

	{% assign page_description = page.description | default: site.description | strip_newlines %}
	{% assign page_image = page.image | default: site.social_image | absolute_url %}
	<title>{{ page.title }} | {{ site.title }}</title>
	<meta name="description" content="{{ page_description }}">
	<link rel="canonical" href="{{ page.url | absolute_url }}">

	<!-- Open Graph / social previews -->
	<meta property="og:type" content="website">
	<meta property="og:site_name" content="{{ site.title }}">
	<meta property="og:title" content="{{ page.title }} | {{ site.title }}">
	<meta property="og:description" content="{{ page_description }}">
	<meta property="og:url" content="{{ page.url | absolute_url }}">
	<meta property="og:image" content="{{ page_image }}">

	<meta name="twitter:card" content="summary_large_image">
	<meta name="twitter:title" content="{{ page.title }} | {{ site.title }}">
	<meta name="twitter:description" content="{{ page_description }}">
	<meta name="twitter:image" content="{{ page_image }}">

	<!-- Favicons (generated from assets/images/yellowme.png, originals untouched) -->
	<link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/images/favicon/favicon-32.png' | relative_url }}">
	<link rel="icon" type="image/png" sizes="16x16" href="{{ '/assets/images/favicon/favicon-16.png' | relative_url }}">
	<link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/images/favicon/apple-touch-icon.png' | relative_url }}">

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
	<script src="https://cdn.jsdelivr.net/npm/masonry-layout@4.2.2/dist/masonry.pkgd.min.js" integrity="sha384-GNFwBvfVxBkLMJpYMOABq3c+d3KnQxudP/mGPkzpZSTYykLBNsZEnG2D9G/X/+7D" crossorigin="anonymous" defer></script>

	<link rel="stylesheet" href="{{'/assets/css/style.css' | relative_url}}">

</head>
<body>
	{% include header.html %}
	{{ content }}
</body>
</html>
