<!--
  section_head.html — a centered heading banner used to divide a project page
  into sections (e.g. "Pattern Prototyping", "Process").

  Required:
    title           heading text

  Optional:
    id              anchor id for the section (for #jump links)
-->

<div class="row mb-4">
    <div class="col-12">
        <div class="section text-center" id = "{{include.id}}">
            <h2>{{ include.title }}</h2>
        </div>
    </div>
</div>
