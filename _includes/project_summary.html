<!--
  project_summary.html — the intro block at the top of a project page: a text
  column plus two side-by-side images. Intended to be included once per page,
  right after the front matter.

  Required:
    img1, img2      image paths for the two side images

  Optional:
    description     markdownified summary text for the left column
    additional      raw HTML appended after the description (e.g. a list, a link)
    img1_mode / img2_mode  "crop" to object-fit: cover instead of the default
                     object-fit: contain (useful for images with mismatched aspect ratios)
    img1_alt        alt text for img1 (falls back to include.title, then page.title)
    img2_alt        alt text for img2 (falls back to include.title, then page.title)
-->

<div class="row mb-4 justify-content-center proj-summary g-3">
  <div class="col-12 col-lg-4 d-flex">
    <div class="section d-flex flex-column h-100 w-100">
      <p>{{ include.description | markdownify}}</p>
      {{ include.additional | raw}}
    </div>
  </div>
  <div class="col-12 col-md-6 col-lg-4 d-flex">
    <div class="d-flex align-items-center justify-content-center overflow-hidden">
      <div class="img-wrapper {{ include.img1_mode }}">
        <img src="{{ include.img1 }}" alt="{{ include.img1_alt | default: include.title | default: page.title }}" loading="lazy" decoding="async" class="img-fluid" />
      </div>
    </div>
  </div>
  <div class="col-12 col-md-6 col-lg-4 d-flex">
    <div class="d-flex align-items-center justify-content-center overflow-hidden">
      <div class="img-wrapper {{ include.img2_mode }}">
        <img src="{{ include.img2 }}" alt="{{ include.img2_alt | default: include.title | default: page.title }}" loading="lazy" decoding="async" class="img-fluid"/>
      </div>
    </div>
  </div>
</div>

<style>
.img-wrapper img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.img-wrapper.crop img {
  object-fit: cover;
}

/* main image determines natural height */
.img-wrapper.main {
  height: auto;
}

/* expand-and-crop option */
.img-wrapper.crop img {
  object-fit: cover;
}
</style>
